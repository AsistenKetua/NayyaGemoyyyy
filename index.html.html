<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Kamu 💖</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* BACKGROUND BARU */
  background: url('https://i.ibb.co.com/DDMRRHDz/bg.jpg') no-repeat center center/cover;
}

.container {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  max-width: 350px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease;
}

h1 {
  color: #ff4d6d;
}

p {
  color: #333;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  background: #e63950;
}

@keyframes fadeIn {
  from {opacity: 0; transform: scale(0.8);}
  to {opacity: 1; transform: scale(1);}
}
</style>
</head>

<body>

<div class="container">
  <h1>Hai NayaGemoyy 💖</h1>
  <p>Kamu itu alasan kenapa aku selalu senyum 😊</p>
  <p>Kapan nih Kita Keluar Bareng Lagi? jawab nya di chat aja ya nayy</p>

  <button onclick="gombal()">Klik Aku 😆</button>
</div>

<script>
function gombal(){
  alert("Kamu itu kayak WiFi... makin deket makin kuat sinyalnya 😆");
}
</script>

</body>
</html>
